# These command aliases are not final, may change
[target.wasm32-wasip1]
# `swc_ast_unknown` 让插件兼容新增 AST 字段的 host，见 https://swc.rs/docs/plugin/ecmascript/compatibility
rustflags = ["-C", "link-arg=--allow-undefined", "--cfg=swc_ast_unknown"]

[alias]
# Alias to build actual plugin binary for the specified target.
build-wasi = "build --target wasm32-wasip1"
build-wasm32 = "build --target wasm32-unknown-unknown"
